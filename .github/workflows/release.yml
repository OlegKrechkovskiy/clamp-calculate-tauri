name: Release Tauri App

on:
  push:
    tags:
      - "v*"

jobs:
  build-all-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64
            asset_patterns: |
              src-tauri/target/**/bundle/dmg/*.dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-x64
            asset_patterns: |
              src-tauri/target/**/bundle/dmg/*.dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows
            asset_patterns: |
              src-tauri/target/**/bundle/msi/*.msi
              src-tauri/target/**/bundle/nsis/*-setup.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.asset_patterns }}
          if-no-files-found: warn

  create-release:
    runs-on: ubuntu-latest
    needs: build-all-platforms
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -iname '*.dmg' -o \
            -iname '*.msi' -o \
            -iname '*-setup.exe' \
          \) -exec cp -f {} release-assets/ \;
          echo "Release assets:"
          ls -la release-assets
          test "$(ls -1 release-assets | wc -l)" -gt 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: release-assets/*
